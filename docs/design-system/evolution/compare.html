<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confident Editorial — Before / After</title>
<style>
  :root { --ink:#1a1814; --muted:#5a6573; --hairline:#e5e5e5; --accent:#0073AB; }
  * { box-sizing:border-box; margin:0; }
  body { font:14px/1.5 Inter, system-ui, sans-serif; color:var(--ink); background:#f4f6fa; padding:32px 40px 80px; }
  h1 { font-size:26px; font-weight:750; letter-spacing:-0.02em; margin-bottom:4px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .controls { position:sticky; top:0; background:#f4f6fa; padding:12px 0; z-index:5; display:flex; gap:8px; border-bottom:1px solid var(--hairline); margin-bottom:28px; }
  .controls button { font:600 12px Inter,sans-serif; padding:7px 14px; border-radius:999px; border:1px solid var(--hairline); background:#fff; cursor:pointer; }
  .controls button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  section { margin-bottom:48px; }
  h2 { font-size:15px; font-weight:650; margin-bottom:2px; }
  .eyebrow { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:10px; }
  figure img { width:100%; display:block; border:1px solid var(--hairline); border-radius:10px; background:#fff; }
  figcaption { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  @media (max-width:1000px){ .pair{grid-template-columns:1fr} }
</style>
</head>
<body>
<h1>Confident Editorial — Before / After</h1>
<div class="sub">Left: master baseline · Right: design/confident-editorial. Toggle theme and width; images come from before/ and after/.</div>
<div class="controls">
  <button data-theme="light" class="on">Light</button>
  <button data-theme="dark">Dark</button>
  <span style="width:16px"></span>
  <button data-width="1440" class="on">1440</button>
  <button data-width="820">820</button>
</div>
<div id="gallery"></div>
<script>
const pages = [
  ['sales-orders','Commerce','Sales Orders — flagship silent table, status-grouped rows'],
  ['order-detail','Commerce','Order Detail — hero net payable, label-over-value grids'],
  ['marketing-landing','Marketing','Marketing Landing — two-tone masthead, ink Da Vinci panel'],
  ['commerce-cloud-landing','Commerce','Commerce Cloud — ink upsell panel'],
  ['email-campaigns','Marketing','Email Campaigns — hero revenue KPI, one-accent table'],
  ['dashboard-home','Dashboards','Dashboard — masthead, editorial KPI widgets'],
  ['all-contacts','Audiences','All Contacts — row grammar, silent table'],
  ['products-list','Commerce','Products — money treatment, typographic stock states'],
  ['settings-general','Settings','Settings General — form rhythm, meta labels'],
  ['journey-builder','Marketing','Journey Builder — quiet chrome'],
  ['da-vinci-experience','Da Vinci','Da Vinci Experience — ghost chips, quiet AI'],
  ['coupons','Control','Coupons — untouched view, inherits system only'],
  ['contact-lists','Control','Contact Lists — untouched view, inherits system only'],
  ['analytics-orders-report','Control','Analytics Orders — untouched view, inherits system only'],
];
let theme='light', width='1440';
function render(){
  document.getElementById('gallery').innerHTML = pages.map(([slug,mod,label])=>`
    <section>
      <div class="eyebrow">${mod}</div>
      <h2>${label}</h2>
      <div class="pair">
        <figure><figcaption>Before</figcaption><img loading="lazy" src="before/${slug}--${width}--${theme}.png"></figure>
        <figure><figcaption>After</figcaption><img loading="lazy" src="after/${slug}--${width}--${theme}.png"></figure>
      </div>
    </section>`).join('');
}
document.querySelectorAll('.controls button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.theme){theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('on',x===b));}
  if(b.dataset.width){width=b.dataset.width;document.querySelectorAll('[data-width]').forEach(x=>x.classList.toggle('on',x===b));}
  render();
}));
render();
</script>
</body>
</html>
